<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Artotel Cabin Bromo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .app-header {
      background: #fff;
      padding: 14px 20px 10px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 1.1rem;
    }
    .title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
    .subtitle { font-size: 0.7rem; color: #64748b; }

    .login-bar {
      display: flex;
      justify-content: center;
      padding: 10px 16px 6px;
      background: #fff;
    }
    .login-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 8px 28px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 140px;
    }
    .login-btn.connected { background: #16a34a; }

    .topbar {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .date-btn {
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .upload-btn {
      background: #0ea5e9;
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 12px;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
      cursor: pointer;
    }
    .card-thumb { height: 120px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 8px 10px 10px; }
    .card-name { font-weight: 600; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { text-align: center; color: #94a3b8; padding: 50px 20px; }

    /* Calendar, Modal, etc. — styles kept similar to previous version */
    .calendar-popup {
      position: absolute; top: 140px; left: 16px;
      background: white; border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      padding: 12px; z-index: 50; display: none; min-width: 280px;
    }
    .calendar-popup.open { display: block; }
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; text-align: center; }
    .cal-day { padding: 8px 0; border-radius: 8px; cursor: pointer; }
    .cal-day.selected, .cal-day:hover { background: #0ea5e9; color: white; }

    .modal { position: fixed; inset: 0; background: rgba(15,23,42,0.75); z-index: 100; display: none; flex-direction: column; }
    .modal.open { display: flex; }
    .modal-header { background: #0f172a; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { flex: 1; overflow: auto; background: #1e293b; position: relative; }
    .zoom-container { transform-origin: 0 0; }
    .page-wrapper { position: relative; margin: 8px auto; background: white; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    .page-canvas { width: 100%; height: auto; display: block; }
    .draw-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
    .draw-overlay.active { pointer-events: auto; touch-action: none; }

    .sign-btn, .undo-btn {
      position: fixed; bottom: 20px; z-index: 200;
      border: none; width: 70px; height: 44px; border-radius: 12px;
      font-weight: 700; color: white; cursor: pointer;
    }
    .sign-btn { right: 16px; background: #0ea5e9; }
    .sign-btn.saving { background: #22c55e; }
    .undo-btn { right: 96px; background: #64748b; display: none; }
    .undo-btn.show { display: block; }

    .status { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.85); color: white; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; z-index: 150; pointer-events: none; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="logo">A</div>
    <div>
      <div class="title">Artotel Cabin Bromo</div>
      <div class="subtitle">Document Management</div>
    </div>
  </div>

  <div class="login-bar">
    <button id="login-btn" class="login-btn">Login Google Drive</button>
  </div>

  <div class="topbar">
    <button id="date-btn" class="date-btn">--</button>
    <button id="upload-btn" class="upload-btn">+ Upload</button>
  </div>

  <div id="calendar-popup" class="calendar-popup"></div>
  <div id="file-grid" class="grid"><div class="empty">Pilih tanggal atau login Drive</div></div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple>

  <div class="modal" id="modal">
    <div class="modal-header">
      <span id="modal-title">Dokumen</span>
      <button id="btn-close" style="background:#475569;color:white;border:none;padding:6px 12px;border-radius:8px;">Tutup</button>
    </div>
    <div class="modal-body" id="preview"></div>
    <div class="status" id="status">Geser 2 jari untuk zoom</div>
    <button id="undo-btn" class="undo-btn">Undo</button>
    <button id="sign-btn" class="sign-btn">Sign</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <script>
    // Ganti dengan Client ID kamu
    const CLIENT_ID = '306993170989-gj16o5hebrf0guteu2ktso60kmmjqg0c.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    const FOLDER_NAME = 'Artotel Cabin Bromo Docs';

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let tokenClient, accessToken = null, folderId = null;
    let currentDate = new Date().toISOString().slice(0,10);
    const dateBtn = document.getElementById('date-btn');
    const loginBtn = document.getElementById('login-btn');
    const fileGrid = document.getElementById('file-grid');
    const fileInput = document.getElementById('file-input');
    const modal = document.getElementById('modal');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const signBtn = document.getElementById('sign-btn');
    const undoBtn = document.getElementById('undo-btn');

    function updateDateBtn() {
      const d = new Date(currentDate+'T00:00:00');
      dateBtn.textContent = d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
    }
    updateDateBtn();

    // ===== Google Drive =====
    window.gapiLoaded = () => gapi.load('client', () => gapi.client.init({ discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] }));
    window.gisLoaded = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPES, callback: ''
      });
    };

    let tokenClient = null;
    let googleReady = false;

    window.gapiLoaded = () => {
      gapi.load('client', () => {
        gapi.client.init({
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']
        }).then(() => {
          console.log('gapi ready');
        }).catch(e => console.error('gapi init error', e));
      });
    };

    window.gisLoaded = () => {
      try {
        tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: ''
        });
        googleReady = true;
        console.log('GIS ready');
        loginBtn.textContent = 'Login Google Drive';
        loginBtn.disabled = false;
      } catch (e) {
        console.error('GIS init error', e);
        loginBtn.textContent = 'Error Google';
      }
    };

    // Disable button until ready
    loginBtn.disabled = true;
    loginBtn.textContent = 'Memuat Google...';

    loginBtn.onclick = () => {
      if (!tokenClient || !googleReady) {
        alert('Google Login belum siap.\n\n1. Pastikan domain https://acbform.netlify.app sudah ditambahkan di Authorized JavaScript origins.\n2. Refresh halaman dan tunggu beberapa detik.\n3. Cek Console (F12) untuk error.');
        return;
      }
      if (accessToken) {
        accessToken = null; folderId = null;
        loginBtn.textContent = 'Login Google Drive';
        loginBtn.classList.remove('connected');
        fileGrid.innerHTML = '<div class="empty">Login Drive untuk melihat file</div>';
        return;
      }
      tokenClient.callback = async resp => {
        if (resp.error) {
          alert('Login gagal: ' + (resp.error_description || resp.error) + '\n\nPastikan domain sudah ditambahkan di Google Cloud.');
          return;
        }
        accessToken = resp.access_token;
        gapi.client.setToken({ access_token: accessToken });
        loginBtn.textContent = 'Terhubung';
        loginBtn.classList.add('connected');
        try {
          await ensureFolder();
          await loadFiles();
        } catch (e) {
          alert('Gagal konek Drive: ' + e.message);
        }
      };
      tokenClient.requestAccessToken({ prompt: 'consent' });
    };

    async function ensureFolder() {
      const r = await gapi.client.drive.files.list({
        q: `name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`,
        fields: 'files(id)'
      });
      if (r.result.files?.length) folderId = r.result.files[0].id;
      else {
        const c = await gapi.client.drive.files.create({
          resource: {name: FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'},
          fields: 'id'
        });
        folderId = c.result.id;
      }
    }

    async function loadFiles() {
      if (!accessToken || !folderId) return;
      const r = await gapi.client.drive.files.list({
        q: `'${folderId}' in parents and mimeType='application/pdf' and trashed=false`,
        fields: 'files(id,name,createdTime,thumbnailLink)',
        orderBy: 'createdTime desc'
      });
      const files = r.result.files || [];
      fileGrid.innerHTML = '';
      if (!files.length) {
        fileGrid.innerHTML = '<div class="empty">Belum ada file</div>';
        return;
      }
      for (const f of files) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-thumb">${f.thumbnailLink ? `<img src="${f.thumbnailLink}">` : 'PDF'}</div>
          <div class="card-body"><div class="card-name">${f.name}</div></div>
        `;
        card.onclick = () => openSigner(f);
        fileGrid.appendChild(card);
      }
    }

    document.getElementById('upload-btn').onclick = () => {
      if (!accessToken) return alert('Login Google Drive dulu');
      fileInput.click();
    };

    fileInput.onchange = async e => {
      if (!e.target.files.length || !accessToken) return;
      try {
        for (const file of e.target.files) {
          const meta = {name: file.name, parents: [folderId]};
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(meta)], {type:'application/json'}));
          form.append('file', file);
          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
            method: 'POST',
            headers: {Authorization: 'Bearer '+accessToken},
            body: form
          });
        }
        await loadFiles();
        alert('Berhasil diunggah ke Drive');
      } catch(err) { alert('Gagal: '+err.message); }
      e.target.value = '';
    };

    // ===== Signing (fitur lengkap tetap ada) =====
    let signMode = false, isDrawing = false, undoStack = [];
    let scale = 1, panX = 0, panY = 0, lastDist = 0, lastMid = {x:0,y:0}, isPinching = false;
    const zoomContainer = document.createElement('div');
    zoomContainer.className = 'zoom-container';

    function applyTransform() { zoomContainer.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`; }
    function resetZoom() { scale=1; panX=0; panY=0; applyTransform(); }

    preview.addEventListener('touchstart', e => {
      if (e.touches.length===2) {
        isPinching=true; isDrawing=false;
        const t1=e.touches[0], t2=e.touches[1];
        lastDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
        lastMid = {x:(t1.clientX+t2.clientX)/2, y:(t1.clientY+t2.clientY)/2};
      }
    }, {passive:false});

    preview.addEventListener('touchmove', e => {
      if (e.touches.length!==2) return;
      e.preventDefault();
      const t1=e.touches[0], t2=e.touches[1];
      const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
      const mid = {x:(t1.clientX+t2.clientX)/2, y:(t1.clientY+t2.clientY)/2};
      const factor = dist/lastDist;
      const ns = Math.min(Math.max(scale*factor, 0.4), 5);
      const rect = preview.getBoundingClientRect();
      panX -= (mid.x - rect.left - panX)*(ns/scale - 1);
      panY -= (mid.y - rect.top - panY)*(ns/scale - 1);
      scale = ns;
      panX += mid.x - lastMid.x;
      panY += mid.y - lastMid.y;
      lastDist=dist; lastMid=mid;
      applyTransform();
    }, {passive:false});

    preview.addEventListener('touchend', e => { if (e.touches.length<2) isPinching=false; });

    function enableDraw(canvas) {
      const ctx = canvas.getContext('2d');
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        const t = e.touches ? e.touches[0] : e;
        return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) };
      };
      const start = e => {
        if (!signMode || isPinching || (e.touches && e.touches.length>1)) return;
        e.preventDefault();
        undoStack.push({canvas, data: ctx.getImageData(0,0,canvas.width,canvas.height)});
        if (undoStack.length>30) undoStack.shift();
        isDrawing = true;
        const p = pos(e);
        ctx.beginPath(); ctx.moveTo(p.x, p.y);
      };
      const draw = e => {
        if (!isDrawing || !signMode || isPinching) return;
        e.preventDefault();
        const p = pos(e);
        ctx.strokeStyle='#111';
        ctx.lineWidth = 3.5*(canvas.width/canvas.getBoundingClientRect().width);
        ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.lineTo(p.x,p.y); ctx.stroke();
      };
      const stop = () => isDrawing=false;
      canvas.addEventListener('touchstart', start, {passive:false});
      canvas.addEventListener('touchmove', draw, {passive:false});
      canvas.addEventListener('touchend', stop);
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);
    }

    undoBtn.onclick = () => {
      if (!undoStack.length) return;
      const last = undoStack.pop();
      last.canvas.getContext('2d').putImageData(last.data, 0, 0);
    };

    let currentFileId = null, currentBuf = null;

    async function openSigner(file) {
      currentFileId = file.id;
      statusEl.textContent = 'Memuat...';
      const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, {
        headers: {Authorization: 'Bearer '+accessToken}
      });
      currentBuf = await res.arrayBuffer();
      document.getElementById('modal-title').textContent = file.name;
      modal.classList.add('open');
      signMode = false;
      signBtn.textContent = 'Sign';
      signBtn.classList.remove('saving');
      undoBtn.classList.remove('show');
      undoStack = [];
      resetZoom();
      preview.innerHTML = '';
      zoomContainer.innerHTML = '';
      preview.appendChild(zoomContainer);
      statusEl.textContent = 'Geser 2 jari untuk zoom • Tekan Sign untuk menandatangani';

      const pdf = await pdfjsLib.getDocument({data: currentBuf.slice(0)}).promise;
      for (let i=1; i<=pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({scale:1.3});
        const pc = document.createElement('canvas');
        pc.width=vp.width; pc.height=vp.height; pc.className='page-canvas';
        const oc = document.createElement('canvas');
        oc.className='draw-overlay'; oc.width=vp.width; oc.height=vp.height; oc.dataset.page=i-1;
        const wrap = document.createElement('div');
        wrap.className='page-wrapper';
        wrap.appendChild(pc); wrap.appendChild(oc);
        zoomContainer.appendChild(wrap);
        await page.render({canvasContext:pc.getContext('2d'), viewport:vp}).promise;
        enableDraw(oc);
      }
    }

    document.getElementById('btn-close').onclick = () => {
      modal.classList.remove('open');
      signMode=false; undoBtn.classList.remove('show');
    };

    signBtn.onclick = async () => {
      if (!signMode) {
        signMode=true;
        signBtn.textContent='✓';
        signBtn.classList.add('saving');
        undoBtn.classList.add('show');
        document.querySelectorAll('.draw-overlay').forEach(c=>c.classList.add('active'));
        statusEl.textContent='Mode Sign aktif. Zoom tetap bisa. Tekan ✓ untuk simpan.';
      } else {
        const overlays = [...document.querySelectorAll('.draw-overlay')];
        const hasInk = overlays.some(o=>{
          const d=o.getContext('2d').getImageData(0,0,o.width,o.height).data;
          for(let i=3;i<d.length;i+=4) if(d[i]>15) return true;
          return false;
        });
        if (!hasInk) {
          signMode=false; signBtn.textContent='Sign'; signBtn.classList.remove('saving');
          undoBtn.classList.remove('show');
          document.querySelectorAll('.draw-overlay').forEach(c=>c.classList.remove('active'));
          return;
        }
        statusEl.textContent='Menyimpan ke Drive...';
        try {
          const {PDFDocument} = PDFLib;
          const doc = await PDFDocument.load(currentBuf);
          const pages = doc.getPages();
          for (const ov of overlays) {
            const idx=+ov.dataset.page;
            const page=pages[idx];
            const {width,height}=page.getSize();
            const url=ov.toDataURL('image/png');
            const bin=atob(url.split(',')[1]);
            const arr=new Uint8Array(bin.length);
            for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
            const img=await doc.embedPng(arr);
            page.drawImage(img,{x:0,y:0,width,height});
          }
          const out = await doc.save();
          const blob = new Blob([out],{type:'application/pdf'});
          // Update file di Drive
          const meta = {name: document.getElementById('modal-title').textContent};
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(meta)],{type:'application/json'}));
          form.append('file', blob);
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${currentFileId}?uploadType=multipart`, {
            method:'PATCH',
            headers:{Authorization:'Bearer '+accessToken},
            body: form
          });
          statusEl.textContent='Tersimpan di Drive!';
          setTimeout(()=>{ modal.classList.remove('open'); loadFiles(); }, 600);
        } catch(err) {
          statusEl.textContent='Gagal: '+err.message;
        }
      }
    };

    // Simple date picker (custom calendar tetap)
    const calPopup = document.getElementById('calendar-popup');
    let viewYear, viewMonth;
    dateBtn.onclick = e => {
      e.stopPropagation();
      const d = new Date(currentDate+'T00:00:00');
      viewYear=d.getFullYear(); viewMonth=d.getMonth();
      renderCal();
      calPopup.classList.toggle('open');
    };
    document.addEventListener('click', ()=>calPopup.classList.remove('open'));

    function renderCal() {
      const first = new Date(viewYear, viewMonth, 1);
      const last = new Date(viewYear, viewMonth+1, 0);
      const start = first.getDay();
      const days = last.getDate();
      let html = `<div class="cal-header"><button id="prev">‹</button><span>${first.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</span><button id="next">›</button></div><div class="cal-grid">`;
      for(let i=0;i<start;i++) html+='<div></div>';
      for(let d=1;d<=days;d++){
        const ds = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        html += `<div class="cal-day ${ds===currentDate?'selected':''}" data-d="${ds}">${d}</div>`;
      }
      html+='</div>';
      calPopup.innerHTML=html;
      document.getElementById('prev').onclick=e=>{e.stopPropagation(); viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCal();};
      document.getElementById('next').onclick=e=>{e.stopPropagation(); viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCal();};
      calPopup.querySelectorAll('[data-d]').forEach(el=>{
        el.onclick=e=>{
          e.stopPropagation();
          currentDate=el.dataset.d;
          updateDateBtn();
          calPopup.classList.remove('open');
          // Filter by date bisa ditambahkan nanti jika metadata tanggal disimpan
          loadFiles();
        };
      });
    }
  </script>
</body>
</html>
